[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-fear-greed-daily"
version = "0.1.0"
description = "Daily CNN Fear & Greed data preparation for an existing notification integration"
requires-python = ">=3.11"
dependencies = ["pandas-market-calendars>=5.4,<6", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
fear-greed = "fear_greed.cli:main"
fear-greed-research = "fear_greed.research.cli:main"

[tool.setuptools.packages.find]
include = ["fear_greed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
